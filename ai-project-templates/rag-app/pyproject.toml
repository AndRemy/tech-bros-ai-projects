[project]
name = "rag-app"
version = "0.1.0"
description = "Template: retrieval-augmented generation over local documents"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# vector = ["chromadb", "voyageai"]   # swap in real embeddings when you outgrow keyword search

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_app"]
