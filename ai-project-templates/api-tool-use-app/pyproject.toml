[project]
name = "tool-app"
version = "0.1.0"
description = "Template: Claude Messages API with a manual tool-use loop"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_app"]
