[project]
name = "notes-agent"
version = "0.1.0"
description = "Template: standalone agent built on the Claude Agent SDK"
requires-python = ">=3.10"
dependencies = ["claude-agent-sdk>=0.1", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_agent"]
