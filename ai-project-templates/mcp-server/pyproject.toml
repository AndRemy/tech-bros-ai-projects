[project]
name = "notes-mcp"
version = "0.1.0"
description = "Template MCP server: store and search meeting notes"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
notes-mcp = "notes_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_mcp"]
